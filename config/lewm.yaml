defaults:
  - _self_

config_name: ${hydra:job.name}

paths:
  data_dir: data
  dataset_h5: data/mineRL_training.h5
  checkpoint_dir: artifacts/checkpoints
  best_model: artifacts/checkpoints/best_model.pt
  latest_model: artifacts/checkpoints/latest_model.pt
  fixtures_dir: artifacts/fixtures
  goal_frame: artifacts/fixtures/goal_frame.pkl
  video_frames: artifacts/fixtures/video_frames.pkl
  logs_dir: artifacts/charts

checkpoint_path: ${paths.checkpoint_dir}
model_path: ${paths.latest_model}

wandb:
  project: lewm
  entity: null # defaults to wandb account

# == Shared ==
action_dim: 10
batch_size: 128
total_epochs: 5
warmup_epochs: 1
sub_trajectory: 8 # 8 frames and 8 actions

sigreg:
  num_proj: 1024
  factor: 1.0
  phi: 0.606 # frequency of normal dist. for epps pulley test
  lambd: 0.1

# == ViT encoder hyperparameters ==
vit:
  image_size: 64
  patch_size: 8 # LeWM paper uses 14; this project currently uses 8 for 64x64 frames.
  num_channels: 3
  num_patches: 64 # (64 / 8) x (64 / 8)

  embedding_dim: 192
  attention_heads: 3
  mlp_hidden_nodes: 768 #  192 x 4 (for scaling laws)
  transformer_blocks: 12

# == Predictor hyperparameters ==
predictor:
  transformer_blocks: 6
  attention_heads: 16
  dropout: 0.10
  history_len: 8 # causal mask sees past 8 timestamps

optimizer:
  lr: 5e-5
  weight_decay: 1e-3

# == Planner hyperparameters ==
planner:
  max_iter: 10
  n_samples: 300
  n_elites: 30
  planning_horizon: 8
  max_steps: 60 # slightly more than og 50
